name: Update Community Ratings

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install gspread google-auth

      - name: Write creds
        env:
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        run: |
          echo "${{ secrets.GOOGLE_CREDS_JSON }}" > /tmp/creds.json
          python3 -c "import json; json.load(open('/tmp/creds.json')); print('JSON valid')" || exit 1

      - name: Run script
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDS_FILE: /tmp/creds.json
        run: |
          python scripts/update_rating.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "chore: update community ratings [skip ci]"
            git push
          fi