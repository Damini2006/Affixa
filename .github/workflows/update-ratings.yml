name: Update Community Ratings

on:
  schedule:
    - cron: "0 0 * * 0"   # Every Sunday at midnight UTC
  workflow_dispatch:       # Allow manual trigger

permissions:
  contents: write          # Needed to push README changes

jobs:
  update-ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth

      - name: Debug secrets
        run: |
          echo "SHEET_ID set: ${GOOGLE_SHEET_ID:+yes}"
          echo "CREDS_JSON set: ${GOOGLE_CREDS_JSON:+yes}"
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}

- name: Write credentials to file
        env:
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        run: |
          cat << 'EOF' > /tmp/creds.json
          ${{ secrets.GOOGLE_CREDS_JSON }}
          EOF
          echo "File written, size: $(wc -c < /tmp/creds.json) bytes"
          head -c 200 /tmp/creds.json

- name: Run rating update script
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDS_FILE: /tmp/creds.json
        run: |
          python scripts/update_rating.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "chore: update community ratings [skip ci]"
            git push
          else
            echo "No changes to README.md"
          fi