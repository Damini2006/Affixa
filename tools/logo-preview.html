<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 32px; background: #0D2620; display: flex; gap: 28px; align-items: center; font-family: sans-serif; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 10px; color: #DAF1DE; font-size: 12px; }
  img { display: block; }
  .light { background: #F2EEE4; padding: 16px; border-radius: 12px; }
</style>
</head>
<body>
  <div class="cell"><img src="../frontend/public/logo.svg" width="320" height="320"><span>320px</span></div>
  <div class="cell"><img src="../frontend/public/logo.svg" width="96" height="96"><span>96px</span></div>
  <div class="cell"><img src="../frontend/public/logo.svg" width="48" height="48"><span>48px</span></div>
  <div class="cell"><img src="../frontend/public/logo.svg" width="32" height="32"><span>32px</span></div>
  <div class="cell light"><img src="../frontend/public/logo.svg" width="96" height="96"><span>light bg</span></div>
</body>
</html>
